# More information about the configuration file can be found here:
# https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/serverless-sam-cli-config.html
version = 0.1

[default.global.parameters]
stack_name = "pachinko-ws"
region = "ap-northeast-1"

[default.build.parameters]
cached = true
parallel = true

[default.validate.parameters]
lint = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
s3_prefix = "pachinko-ws"
image_repositories = []

[default.package.parameters]
resolve_s3 = true

[default.sync.parameters]
watch = true

[default.local_start_api.parameters]
warm_containers = "EAGER"

[default.local_start_lambda.parameters]
warm_containers = "EAGER"

[AkioHiratani.deploy.parameters]
stack_name = "pachinko-ws-AkioHiratani"
resolve_s3 = true
s3_prefix = "pachinko-ws-AkioHiratani"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "StageName=\"AkioHiratani\" ApiName=\"pachinko-ws-AkioHiratani\" ConnectionsTableName=\"pachinko_ws_connections_AkioHiratani\" AdminSecretParameter=\"/pachinko/AkioHiratani/admin/secret\" AdminSecretVersion=\"1\""
image_repositories = []

[AkioHiratani.global.parameters]
region = "ap-northeast-1"

["[AkioHiratani".deploy.parameters]
stack_name = "pachinko-ws-AkioHiratani"
resolve_s3 = true
s3_prefix = "pachinko-ws-AkioHiratani"
region = "ap-northeast-1"
capabilities = "CAPABILITY_IAM"
parameter_overrides = "StageName=\"AkioHiratani\" ApiName=\"pachinko-ws-AkioHiratani\" ConnectionsTableName=\"pachinko_ws_connections_AkioHiratani\" AdminSecretParameter=\"AkioHiratani\" AdminSecretVersion=\"1\""
image_repositories = []

["[AkioHiratani".global.parameters]
region = "ap-northeast-1"
